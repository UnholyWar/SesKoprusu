name: Windows setup
on:
  push:
    branches: [test/ses-koprusu, release/audio-monitor]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Windows installer
        shell: pwsh
        run: |
          $env:Path += ";$([Environment]::GetFolderPath('ProgramFilesX86'))\Inno Setup 6"
          ./setup/Build.ps1 -Version $env:BUILD_VERSION
      - name: Publish Windows setup
        shell: pwsh
        run: |
          # Existing installations use this prefix to find updates.
          $tag = "setup-test-v$env:BUILD_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          $title = "SesKöprüsü $env:BUILD_VERSION"
          if ($env:GITHUB_REF_NAME -eq 'release/audio-monitor') {
            $releaseFlags = @('--latest')
          } else {
            $releaseFlags = @('--prerelease')
            $title += ' (test)'
          }
          gh release create $tag setup/Output/SesKoprusu-Setup.exe @releaseFlags --target $env:GITHUB_SHA --title $title --notes "Windows x64 setup for commit $env:GITHUB_SHA"
