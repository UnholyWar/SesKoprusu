name: Windows test setup
on:
  push:
    branches: [test/ses-koprusu]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Windows installer
        shell: pwsh
        run: |
          $env:Path += ";$([Environment]::GetFolderPath('ProgramFilesX86'))\Inno Setup 6"
          ./setup/Build.ps1 -Version $env:BUILD_VERSION
      - name: Publish test setup
        shell: pwsh
        run: |
          $tag = "setup-test-v$env:BUILD_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          gh release create $tag setup/Output/SesKoprusu-Setup.exe --prerelease --target $env:GITHUB_SHA --title "SesKöprüsü $env:BUILD_VERSION (test)" --notes "Windows x64 setup for commit $env:GITHUB_SHA"
